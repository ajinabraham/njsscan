rules:
- id: node_nosqli_injection
  mode: taint
  pattern-sources:
    - patterns:
        - pattern-either:
            - pattern: $REQ.$PROP
            - pattern: $REQ.$PROP.$FIELD
            - pattern: $REQ.$PROP[$KEY]
        - metavariable-regex:
            metavariable: $REQ
            regex: (?i)^(req|request)$
        - metavariable-regex:
            metavariable: $PROP
            regex: ^(body|query|params|headers|cookies)$
  pattern-sanitizers:
    - patterns:
        - pattern: $SANITIZE(...)
        - pattern-either:
            - pattern-inside: |
                $SANITIZE = require('mongo-sanitize')
                ...
            - pattern-inside: |
                import $SANITIZE from 'mongo-sanitize'
                ...
            - pattern-inside: |
                import * as $SANITIZE from 'mongo-sanitize'
                ...
            - pattern-inside: |
                import {..., $SANITIZE, ...} from 'mongo-sanitize'
                ...
  pattern-sinks:
    - pattern: $OBJ.findOne($QUERY, ...)
  pattern-not-sinks:
    - patterns:
        - pattern: $OBJ.findOne($QUERY, ...)
        - pattern-either:
            - pattern-inside: |
                $SEQUELIZE = require('sequelize')
                ...
                $SEQUELIZE(...)
                ...
            - pattern-inside: |
                import $SEQUELIZE from 'sequelize'
                ...
                $SEQUELIZE(...)
                ...
  message: Untrusted user input in findOne() function can result in NoSQL Injection.
  languages:
  - javascript
  severity: ERROR
  metadata:
    owasp-web: a1
    cwe: cwe-943
